<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <script>
    (function () {
      const originalSend = WebSocket.prototype.send;
      WebSocket.prototype.send = function (data) {
        if (this.readyState === 0) {
          const self = this;
          const sendOnOpen = function () {
            try {
              originalSend.call(self, data);
            } catch (err) { }
            self.removeEventListener('open', sendOnOpen);
          };
          this.addEventListener('open', sendOnOpen);
        } else if (this.readyState === 1) {
          return originalSend.call(this, data);
        }
      };
    })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description"
    content="Aurum & Ember – Fine dining restaurant in Lagos. Experience extraordinary cuisine where bold flavours meet refined elegance." />

</head>
