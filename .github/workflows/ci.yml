name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    name: Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

  backend-check:
    name: Backend Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      - name: Verify server starts
        working-directory: ./backend
        run: timeout 10 node -e "
          import('./server.js').then(() => {
            console.log('Server module loaded OK');
            process.exit(0);
          }).catch(e => {
            console.error('Server failed:', e.message);
            process.exit(1);
          });
        "
        env:
          NODE_ENV: test
          PORT: 5000
          JWT_SECRET: test-secret-for-ci-only-64-chars-long-xxxxxxxxxxxxxx
          ADMIN_SETUP_TOKEN: test-token-ci
          MONGODB_URI: mongodb://localhost:27017/test
          PAYSTACK_SECRET_KEY: sk_test_ci
          PAYSTACK_PUBLIC_KEY: pk_test_ci
          FRONTEND_URL: http://localhost:5173
          ALLOWED_ORIGINS: http://localhost:5173
